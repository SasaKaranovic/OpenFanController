name: Python tests

# Runs the Software/Python unit tests (no hardware needed) on every PR that touches the
# Python software, and on pushes to master. Make "Python tests" a required status check
# in the branch protection rules so a PR can't be merged while tests fail.
on:
  pull_request:
    paths:
      - 'Software/Python/**'
      - '.github/workflows/python_tests.yaml'
  push:
    branches: ['master']
    paths:
      - 'Software/Python/**'
      - '.github/workflows/python_tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.12']
    defaults:
      run:
        working-directory: Software/Python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Software/Python/requirements.txt
            Software/Python/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHON: python
        run: bash run_tests.sh --cov

  hardware-simulated:
    # The hardware test suite against simulated controllers (real web server code, simulated
    # firmware). Runs on GitHub-hosted runners, so it is safe for pull requests, and it keeps
    # hardware_tests/ itself working between real hardware runs.
    name: hardware tests (${{ matrix.device }}, simulated)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [sim-controller, sim-xl, sim-micro]
    defaults:
      run:
        working-directory: Software/Python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Software/Python/requirements.txt
            Software/Python/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run hardware tests on ${{ matrix.device }} (scope all)
        env:
          PYTHON: python
        run: bash run_tests.sh hardware --device ${{ matrix.device }} --scope all --suite all

      - name: Summary
        if: always()
        run: python hardware_tests/summarize.py hardware_tests/results >> "$GITHUB_STEP_SUMMARY"
